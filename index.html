<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121f2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>SCALA</title>
  </head>
  <body>
    <div id="home"></div>
    <div id="orientation-lock" role="dialog" aria-modal="true" aria-labelledby="orientation-lock-title" hidden>
      <div class="orientation-lock__inner">
        <div class="orientation-lock__icon" aria-hidden="true">📱</div>
        <h2 class="orientation-lock__title" id="orientation-lock-title">Gira tu dispositivo</h2>
        <p class="orientation-lock__text">
          SCALA se juega en <strong>horizontal</strong> para ver el mundo 3D y construir sin que los paneles se tapen.
        </p>
      </div>
    </div>
    <canvas id="renderCanvas"></canvas>
    <div id="ui-layer">
      <div id="hud"></div>
      <div id="dimension-panel"></div>
      <div id="selection-panel"></div>
      <div id="move-panel"></div>
      <div id="ui-toolbar"></div>
      <div id="dialogue-box"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
